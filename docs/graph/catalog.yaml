# Flourish Documentation Graph Catalog
# Lists major documentation hubs and their canonical paths.

hubs:
  - id: global-index
    path: docs/index.md
    title: Flourish Documentation
    description: Global entry point for all Flourish documentation

  - id: app-index
    path: docs/app/index.md
    title: App Documentation
    description: All documentation for the Flourish macOS application

  - id: app-nav-map
    path: docs/app/NAVIGATION_MAP.md
    title: App Navigation Map
    description: Persona-based reading paths and cross-link map

  - id: adr-index
    path: docs/app/adr/README.md
    title: ADR Index
    description: Index of all 14 Architectural Decision Records

  - id: security
    path: docs/platform/security.md
    title: Security Reference
    description: Threat model, data flows, and security standards

  - id: book-flourish
    path: docs/books/flourish-app.md
    title: Book — Flourish App
    description: Curated reading paths for four personas

